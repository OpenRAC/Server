# On a version tag (v1.2.0): the two jars on a GitHub release with their checksums, and the Docker
# image on ghcr.io under the tag and latest. Deploying stays with whoever runs the servers.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  jars:
    name: Release the jars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build and test
        run: ./gradlew build :hub:buildHubJar :server:buildServerJar --console=plain

      - name: Name the jars after the tag and sum them
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp services/hub/build/libs/openrac-hub-1.0.0.jar "dist/openrac-hub-${TAG#v}.jar"
          cp services/server/build/libs/openrac-server-1.0.0.jar "dist/openrac-server-${TAG#v}.jar"
          cd dist
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes

  image:
    name: Push the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openrac/server
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
