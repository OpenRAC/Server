# Builds and tests every push and pull request: the Gradle build with the PostgreSQL tests, the
# coding conventions, the docs' links, the Docker image, and a whole network started by compose.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openrac_test
          POSTGRES_USER: openrac
          POSTGRES_PASSWORD: openrac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrac -d openrac_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/openrac_test
      TEST_DATABASE_USER: openrac
      TEST_DATABASE_PASSWORD: openrac

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Check the PostgreSQL tests ran
        run: python3 scripts/check_tests_ran.py services/hub/build/test-results/test/TEST-com.openrac.hub.PostgresStoreTests*.xml

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            services/*/build/reports/tests/
            services/*/build/test-results/
          if-no-files-found: ignore

  conventions:
    name: Coding conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the changed files and commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"

          # A new branch or a rewritten history has no usable base, so everything is checked.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            python3 scripts/check_conventions.py --all --commits HEAD~1..HEAD
          else
            python3 scripts/check_conventions.py --base "$base" --commits "$base..HEAD"
          fi

      - name: Check every file
        run: python3 scripts/check_conventions.py --all

  links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Check the relative links and anchors
        run: python3 scripts/check_links.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: openrac-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Compose smoke test
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The image compose names, from the build job's cache.
      - name: Load the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openrac-server
          cache-from: type=gha

      - name: Start PostgreSQL, the hub and a game server
        run: docker compose up -d --wait --wait-timeout 120

      - name: Log in at the hub and prove it to the game server
        run: python3 scripts/smoke_test.py --wait 90

      - name: Show the services' logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the services
        if: always()
        run: docker compose down -v
