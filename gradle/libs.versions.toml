# Single source of truth for dependency versions.

[versions]
netty = "4.2.19.Final"
dotenv = "3.2.0"
gson = "2.13.2"
junit = "6.1.3"
postgresql = "42.7.14"
hikari = "7.1.0"
flyway = "13.12.2"
bcrypt = "0.10.2"
shadow = "9.5.1"

[libraries]
# Framing, codecs and the NIO transport.
netty-codec-base = { module = "io.netty:netty-codec-base", version.ref = "netty" }

# The HTTP side-port that stores mod sets.
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }

# Reads the mod sets it stores, to check them against their schema.
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# .env loading for the environment.
dotenv-java = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }

# The hub's accounts: the PostgreSQL driver, its pool, the schema migrations and password hashes.
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

# Versions come from junit-bom.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# One runnable jar per service, with every library's service files merged.
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
