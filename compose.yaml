# The server with Docker Compose: docker compose up -d (and docker compose logs -f).
# A .env beside this file, if there is one, overrides .env.defaults inside the container.
services:
  server:
    build: .
    image: openrac-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "7770:7770/tcp"
      - "7770:7770/udp"
